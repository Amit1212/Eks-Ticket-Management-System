apiVersion: v1
kind: Service
metadata:
  name: ticket-backend
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ticket-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-backend

  template:
    metadata:
      labels:
        app: ticket-backend

    spec:
      serviceAccountName: ticket-backend-sa

      containers:
        - name: backend
          image: YOUR_BACKEND_ECR_IMAGE
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
            - |
              export ConnectionStrings__DefaultConnection="Server=ticket-sqlserver,1433;Database=TicketDB;User Id=$(cat /mnt/secrets-store/sql-username);Password=$(cat /mnt/secrets-store/sql-password);TrustServerCertificate=True;"
              exec dotnet TicketBackend.dll

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: sql-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: sql-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ticket-backend-secrets
