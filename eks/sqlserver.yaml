apiVersion: v1
kind: Service
metadata:
  name: ticket-sqlserver-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: ticket-sqlserver
  ports:
    - name: sql
      port: 1433
      targetPort: 1433

---
apiVersion: v1
kind: Service
metadata:
  name: ticket-sqlserver
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ticket-sqlserver
  ports:
    - name: sql
      port: 1433
      targetPort: 1433

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ticket-sqlserver
  namespace: default
spec:
  serviceName: ticket-sqlserver-headless
  replicas: 1
  selector:
    matchLabels:
      app: ticket-sqlserver

  template:
    metadata:
      labels:
        app: ticket-sqlserver

    spec:
      serviceAccountName: ticket-sqlserver-sa
      
      nodeSelector:
       workload: database  

      securityContext:
        fsGroup: 10001

      containers:
        - name: sqlserver
          image: 234632868467.dkr.ecr.ap-south-1.amazonaws.com/ticket-sqlserver:2022
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -c
            - |
              export ACCEPT_EULA=Y
              export MSSQL_PID=Developer
              export MSSQL_SA_PASSWORD="$(cat /mnt/secrets-store/sql-password)"
              exec /opt/mssql/bin/sqlservr

          ports:
            - name: sql
              containerPort: 1433

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql

            - name: sqlserver-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

          startupProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6

      volumes:
        - name: sqlserver-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ticket-sqlserver-secrets

        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-data
