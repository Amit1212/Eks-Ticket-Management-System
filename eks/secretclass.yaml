apiVersion: secrets-store.csi.x-k8s.io/v1 
kind: SecretProviderClass 
metadata: 
  name: ticket-backend-secrets
spec: 
  provider: aws 
  parameters: 
    objects: |
      - objectName: "ticket-management/sqlserver"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: sql-username
          - path: password
            objectAlias: sql-password  
    usePodIdentity: "true"    
