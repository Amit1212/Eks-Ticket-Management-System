apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ticket-sqlserver-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "ticket-management/sqlserver"
        objectType: "secretsmanager"
        jmesPath:
          - path: password
            objectAlias: sql-password
              
